name: Issue association

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  group: issue-association-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
      statuses: write
    steps:
      # Trusted default-branch workflow only; no checkout and no PR code execution.
      - name: Verify association and report on the PR head commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const allowed = user => user?.login === 'fabiomoggi' && user.id === 2768565;
            const ensure = (condition, message) => { if (!condition) throw new Error(message); };
            ensure(repository === 'fm-budget-planner/backend', 'Unexpected repository');

            ensure(context.eventName === 'pull_request_target', 'Unexpected event');
            const number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.sha;
            const status = (state, description) => github.rest.repos.createCommitStatus({
              owner, repo, sha: head, state, description, context: 'issue-association',
              target_url: `https://github.com/${repository}/actions/runs/${context.runId}`
            });
            await status('pending', 'Verifying issue and branch association');
            try {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open' || pr.head.sha !== head) {
                core.notice('Stale PR event; no success status published');
                return;
              }
              ensure(pr.base.ref === 'main' && pr.base.repo.full_name === repository, 'PR must target main');
              ensure(pr.head.repo?.full_name === repository, 'PR must use this repository’s issue branch');
              const match = /^([1-9][0-9]*)-[a-z0-9]+(?:_[a-z0-9]+)*$/.exec(pr.head.ref);
              ensure(match && Number.isSafeInteger(Number(match[1])), 'Expected <issue-number>-<title_slug>');
              const issueNumber = Number(match[1]);
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              ensure(!issue.pull_request && allowed(issue.user), 'Expected an issue created by fabiomoggi');
              let cursor = null;
              let associated = false;
              do {
                const result = await github.graphql(`
                  query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                    repository(owner:$owner, name:$repo) {
                      pullRequest(number:$number) {
                        closingIssuesReferences(first:100, after:$cursor) {
                          nodes { number repository { nameWithOwner } }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`, { owner, repo, number, cursor });
                const links = result.repository.pullRequest.closingIssuesReferences;
                associated = links.nodes.some(link => link.number === issueNumber
                  && link.repository.nameWithOwner === repository);
                if (associated || !links.pageInfo.hasNextPage) break;
                ensure(links.pageInfo.endCursor && links.pageInfo.endCursor !== cursor, 'Incomplete issue links');
                cursor = links.pageInfo.endCursor;
              } while (true);
              ensure(associated, 'PR must have a closing link to its matching issue (Closes #N)');
              const { data: latest } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              ensure(latest.state === 'open' && latest.head.sha === head && latest.head.ref === pr.head.ref
                && latest.base.ref === 'main' && latest.body === pr.body, 'PR changed during validation; rerun');
              await status('success', `Verified association for issue #${issueNumber}`);
            } catch (error) {
              await status('failure', 'Issue association failed; see workflow log');
              throw error;
            }
