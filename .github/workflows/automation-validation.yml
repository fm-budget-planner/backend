name: Automation validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: automation-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: automation-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate all GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          lint_dir="$(mktemp -d)"
          trap 'rm -rf "$lint_dir"' EXIT
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$lint_dir/actionlint.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$lint_dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -version
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          test "${#workflows[@]}" -gt 0
          "$lint_dir/actionlint" -color "${workflows[@]}"
